# Check, and on request repair, /boot/grub/grubenv on the bitbaum box.
# Default is a dry run (read-only). Same SSH setup as disk-cleanup.yml.
#
# Run:  gh workflow run grubenv-repair.yml                  # check only
#       gh workflow run grubenv-repair.yml -f dry_run=false # repair if invalid
name: Box grubenv repair

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and print the plan only; change nothing"
        required: false
        default: true
        type: boolean

concurrency:
  group: box-grubenv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  grubenv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HETZNER_IP: ${{ vars.HETZNER_IP }}
    steps:
      - uses: actions/checkout@v7

      - name: SSH setup (same key and host as deploy.yml)
        run: |
          test -n "$HETZNER_IP" || { echo "::error::org variable HETZNER_IP is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HETZNER_IP" >> ~/.ssh/config

      - name: Check (or repair) grubenv
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [ "$DRY_RUN" = "true" ] && D=1 || D=0
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "root@$HETZNER_IP" bash -s -- "$D" < scripts/hetzner/grubenv-repair.sh
