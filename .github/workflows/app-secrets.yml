name: App secrets

# The secrets an app needs that no human holds — a cron bearer token, a Web
# Push key pair — generated and written into the app's env ON THE BOX, from
# GitHub, over the same SSH the deploy uses (HETZNER_SSH_KEY, HETZNER_IP).
# scripts/hetzner/app-secrets.sh is the registry and the rules: it adds only
# what is missing, never overwrites, prints names and never values (this repo
# is public, so these logs are too), and restarts the app only when it added
# something. With `crons` on, it then re-runs install-app-crons.sh so a timer
# that presents the new CRON_SECRET exists.
#
# Manual on purpose: it writes to the box.
#   gh workflow run app-secrets.yml -f app=heidi -f action=ensure
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Register name of the app (apps.conf), e.g. heidi"
        required: true
        default: heidi
      action:
        description: "show (names, set or not) or ensure (add what is missing)"
        required: true
        default: show
        type: choice
        options: [show, ensure]
      crons:
        description: "After ensure, (re)install the apps' systemd timers"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Its own group, not deploy-prod: GitHub keeps ONE pending run per group and
# cancels the older one when another arrives, so a run of this queued behind a
# deploy was silently cancelled by the next deploy (first run, 2026-10-22). It
# touches one app's env and restarts that app; a deploy does not edit .env.
concurrency:
  group: app-secrets-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  app-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HETZNER_IP: ${{ vars.HETZNER_IP }}
    steps:
      - uses: actions/checkout@v7

      - name: SSH setup (same key and host as deploy.yml)
        run: |
          test -n "$HETZNER_IP" || { echo "::error::org variable HETZNER_IP is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HETZNER_IP" >> ~/.ssh/config

      - name: ${{ inputs.action }} ${{ inputs.app }}
        env:
          ACTION: ${{ inputs.action }}
          APP: ${{ inputs.app }}
        run: bash scripts/hetzner/app-secrets.sh "$ACTION" "$APP"

      - name: Install the apps' timers
        if: ${{ inputs.action == 'ensure' && inputs.crons }}
        run: bash scripts/hetzner/install-app-crons.sh
