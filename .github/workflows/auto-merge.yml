# Auto-merge — nobody is in the merge loop.
#
# Green, ready PRs merge themselves and deploy themselves. The policy lives in
# ONE place for the whole fleet — bitbaum/fleet,
# scripts/ci/auto-merge-sweep.sh — and this file only says "run it, with these
# settings".
#
# This repo held one of eight drifted copies of that script. Its own unique
# contribution — the DEPLOY RECONCILER — is now in the canonical, which is why
# this conversion is finally safe: converting before that landed would have let
# merges reach main and never reach the box.
#
# HOW A MERGE ACTUALLY REACHES THE BOX (do not remove deploy_workflow)
#   A push made with GITHUB_TOKEN triggers no workflows, and neither does a run
#   that GITHUB_TOKEN dispatched — so nothing downstream wakes on an automated
#   merge. Observed 2026-08-05: three PRs merged, main green, ZERO Deploy runs.
#   The sweep therefore RECONCILES: it compares main's tip against the last
#   successful deploy and dispatches deploy.yml when they differ, so a deploy
#   that never fired or fired and failed is retried on the next sweep instead of
#   leaving a commit merged-but-not-live.
#
# The triggers stay here because they are genuinely per-repo: workflow_run must
# name the CI workflow exactly.
#
# To stop all of this: delete this file, or add a `hold` label to a PR.
name: Auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Declared on the CALLER as well as inside the reusable workflow: a called
# workflow's token is capped by what the caller grants, so relying on the
# callee's block alone can hand it a read-only token — and the sweep would then
# merge nothing while still exiting 0, which is indistinguishable from having
# nothing to merge.
permissions:
  contents: write # merge the PR
  pull-requests: write # read PR state, delete the branch
  actions: write # dispatch the re-arm and deploy workflows
  checks: read # statusCheckRollup — only load-bearing on private repos
  statuses: read

jobs:
  sweep:
    uses: bitbaum/fleet/.github/workflows/auto-merge-sweep.yml@main
    with:
      base_branch: main
      ci_workflow: ci.yml
      # SPACE-separated: the sweep word-splits this. A comma would become one
      # bogus token, every dispatch would fail, and the only symptom would be
      # that nothing deploys — while the sweep still reported success.
      rearm_workflows: "ci.yml"
      # The reconciler. Without this, merges land and never ship (see above).
      deploy_workflow: deploy.yml
      # What the reconciler treats as LIVE: the box's own answer, not the last
      # Deploy run's headSha. GitHub labels a workflow_run-triggered run with
      # main's tip at trigger time, so on 2026-09-25 run 36135832127 shipped
      # f2f6206 while labelled 4622869, and the sweep believed 4622869 was live
      # and never dispatched it. An unreachable or malformed answer counts as
      # not deployed.
      live_commit_url: https://loki.orangecat.ch/api/health
    secrets:
      # GITHUB_TOKEN cannot merge a PR that touches .github/workflows, so every
      # Dependabot `github_actions` bump stalls forever: the sweep tries, the
      # merge API refuses, it logs "leaving for the next sweep", and repeats —
      # while still exiting 0. ai-kit #11 sat green for nine days that way, and
      # aoz-begleitung #122 for nine more.
      #
      # A PAT also makes the queue drain at CI speed rather than at the
      # schedule's. A dispatch made with GITHUB_TOKEN emits no workflow_run, so
      # after each merge nothing wakes the sweep for the next PR until the cron
      # fires — and GitHub throttles that to roughly hourly whatever the cron
      # says. A PAT-created dispatch does emit it.
      #
      # Undefined resolves to empty and the reusable workflow falls back to
      # github.token, so this line is inert until the org secret exists.
      token: ${{ secrets.FLEET_PAT }}
