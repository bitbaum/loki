name: Previews

# Make a prospect preview reachable, and keep every preview reachable.
#
#   create  make the preview in Loki (as the operator), give it its own address
#           <address>.orangecat.ch, and prove that address answers over HTTPS.
#   website /change "Improve this site" for a live website, as the operator —
#           the consultation, the brief, the folder, the host and the build,
#           on the deployed app. How the flow is dogfooded without a browser.
#   check   open a preview as its owner — the site, the before-and-after tour
#           and its first pictures — and print what answered.
#   heal    every preview folder on the box has its address and answers.
#           Runs on a clock, so a lost Caddy vhost is put back before anyone
#           opens the link (an address without one shows ERR_SSL_PROTOCOL_ERROR).
#
# The access code is normally set in the app ("set the preview code to ..." in
# Loki's chat, or the Access code field in Build a preview). It can also be given
# here once: it is masked in the logs, but a public repo shows a run's inputs, so
# delete the run right after.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "create, website, check or heal"
        required: true
        default: "heal"
      website:
        description: "website: the live site to improve, e.g. center-com.ru"
        required: false
      changes:
        description: "website: what the owner wants, in words (optional)"
        required: false
      fixes:
        description: "website: consultation check ids to fix, comma-separated (src/config/site-consult)"
        required: false
      answers:
        description: "website: one-tap answers, e.g. goal:buy,look:refresh"
        required: false
      address:
        description: "create/check: the subdomain, e.g. francesco"
        required: false
      name:
        description: "create: who it is for, e.g. Francesco Tarallo"
        required: false
      about:
        description: "create: links, place, trade"
        required: false
      code:
        description: "create/website: set the access code (masked in logs; delete the run afterwards)"
        required: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

# One writer of the box's Caddy at a time, and never alongside a deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HETZNER_IP: ${{ vars.HETZNER_IP }}
      MODE: ${{ inputs.mode || 'heal' }}
      ADDRESS: ${{ inputs.address }}
      WEBSITE: ${{ inputs.website }}
      CHANGES: ${{ inputs.changes }}
      FIXES: ${{ inputs.fixes }}
      ANSWERS: ${{ inputs.answers }}
      NAME: ${{ inputs.name }}
      ABOUT: ${{ inputs.about }}
      CODE: ${{ inputs.code }}
    steps:
      - uses: actions/checkout@v7

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure
        env:
          DEPLOY_KEY_PATH: /home/runner/.ssh/id_deploy
        run: |
          [ -z "$CODE" ] || echo "::add-mask::$CODE"
          case "$MODE" in
            create)  bash scripts/hetzner/ensure-preview.sh create "$ADDRESS" "$NAME" "$ABOUT" "$CODE" ;;
            website) bash scripts/hetzner/ensure-preview.sh website "$WEBSITE" "$CHANGES" "$FIXES" "$ANSWERS" "$CODE" ;;
            check)   bash scripts/hetzner/ensure-preview.sh check "$ADDRESS" ;;
            heal)    bash scripts/hetzner/ensure-preview.sh heal ;;
            *)       echo "::error::mode is create, website, check or heal"; exit 1 ;;
          esac
