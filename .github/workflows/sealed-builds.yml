# Read, test, or switch sealed builds for one runner unit. Same SSH as box-doctor.yml.
#   gh workflow run sealed-builds.yml -f mode=read
#   gh workflow run sealed-builds.yml -f mode=test -f unit=loki-box-runner
name: Sealed builds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read | test | on | off"
        required: true
        default: read
        type: choice
        options: [read, test, on, off, matrix]
      unit:
        description: "Runner unit (owner: loki-box-runner)"
        required: false
        default: loki-box-runner

concurrency:
  group: sealed-builds
  cancel-in-progress: false

jobs:
  ctl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HETZNER_IP: ${{ vars.HETZNER_IP }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH setup (same key and host as deploy.yml)
        run: |
          test -n "$HETZNER_IP" || { echo "::error::org variable HETZNER_IP is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HETZNER_IP" >> ~/.ssh/config
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          UNIT: ${{ inputs.unit }}
        run: |
          case "$UNIT" in loki-box-runner|loki-box-runner@[a-z0-9-]*) ;; *) echo "::error::bad unit"; exit 1 ;; esac
          ssh "root@$HETZNER_IP" bash -s -- "$MODE" "$UNIT" < scripts/hetzner/sealed-builds-ctl.sh
