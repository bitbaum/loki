# Install the day plan's prompt (scripts/openclaw/day-plan/) into OpenClaw's
# cron file on bitbaum, and switch off jobs that only post machine warnings.
#
# The morning brief's words used to live only in a file on the box that no
# review ever saw. Now they are reviewed here and land on merge. The installer
# keeps a timestamped backup beside the file and prints job names only.
#
# Same SSH setup as openclaw-skill-install.yml (HETZNER_SSH_KEY, HETZNER_IP).
name: OpenClaw day plan

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/openclaw/day-plan/**"
      - ".github/workflows/openclaw-day-plan.yml"

concurrency:
  group: openclaw-day-plan
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HETZNER_IP: ${{ vars.HETZNER_IP }}
    steps:
      - uses: actions/checkout@v7

      - name: SSH setup (same key and host as deploy.yml)
        run: |
          test -n "$HETZNER_IP" || { echo "::error::org variable HETZNER_IP is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HETZNER_IP" >> ~/.ssh/config

      - name: Install the day plan
        run: |
          tar -C scripts/openclaw/day-plan -cz . \
            | ssh "root@$HETZNER_IP" 'd=$(mktemp -d) && tar -xz -C "$d" && bash "$d/install.sh"; rc=$?; rm -rf "$d"; exit $rc'
