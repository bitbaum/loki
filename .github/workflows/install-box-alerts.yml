# Apply the box's alerting from GitHub: lib-alert and the host sweep, the
# security watch, and Loki's own self-heal loop (ivy-health).
#
# These only change the box when somebody runs them, and nobody did: fixes for
# "⚙️ STILL FAILING: run-p…" and "📝 SENSITIVE FILE(S) CHANGED" sat in the repo
# while the phone kept ringing all night (2026-11-01/02). So a merge that
# touches them installs them. All three are idempotent; the installers seed
# their own new checks journal-only.
#
# Same SSH setup as box-doctor.yml (HETZNER_SSH_KEY, HETZNER_IP).
name: Install box alerts

on:
  push:
    branches: [main]
    paths:
      - scripts/hetzner/install-host-alerts.sh
      - scripts/hetzner/install-security-watch.sh
      - scripts/hetzner/ivy-health.sh
      - .github/workflows/install-box-alerts.yml
  workflow_dispatch: {}

concurrency:
  group: install-box-alerts
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HETZNER_IP: ${{ vars.HETZNER_IP }}
    steps:
      - uses: actions/checkout@v7

      - name: SSH setup (same key and host as deploy.yml)
        run: |
          test -n "$HETZNER_IP" || { echo "::error::org variable HETZNER_IP is not set"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HETZNER_IP" >> ~/.ssh/config

      # Order matters: the security watch and ivy-health use lib-alert.sh from the first.
      - name: Install host alerts (lib-alert, sweep, OnFailure)
        run: BOX="root@$HETZNER_IP" bash scripts/hetzner/install-host-alerts.sh

      - name: Install security watch
        run: BOX="root@$HETZNER_IP" bash scripts/hetzner/install-security-watch.sh

      - name: Install ivy-health (Loki's self-heal loop)
        run: |
          ssh "root@$HETZNER_IP" 'cat > /tmp/ivy-health.sh && install -m 755 /tmp/ivy-health.sh /usr/local/bin/ivy-health.sh && rm -f /tmp/ivy-health.sh' \
            < scripts/hetzner/ivy-health.sh
