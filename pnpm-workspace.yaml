# packages/agent replaces the npm "workspaces" field; bridge/ (its own npm
# package with its own lockfile under npm) joins the workspace so the whole
# repo installs with ONE pnpm install and one lockfile.
packages:
  - packages/*
  - bridge

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  "@sentry/cli": true
  # Git dep needs its prepare build; pnpm demands the exact resolved URL.
  # If the listkit pin moves, update this sha — pnpm prints the new key in its
  # ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED message. (Same shape evig uses for
  # ai-forms; it goes away if listkit is ever published to npm, because a
  # published tarball ships dist/ and needs no build here.)
  listkit@https://codeload.github.com/bitbaum/listkit/tar.gz/69cb4f4ef12d6a2a56b56db1bb4d4ac14aced525: true

# Security pin. This lived in package.json "overrides", which pnpm silently
# IGNORES (npm-only field) — it must live here to keep applying.
overrides:
  # Transitive high advisories the daily Audit refuses (2026-09-07 → ): Sentry
  # build tooling and shadcn's config loader; neither reachable at runtime.
  # Drop each line once the parent ships a fixed range.
  "browserslist@<=4.28.6": ">=4.28.7"
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2"
  fast-uri: ^3.1.6
  # Medium/low transitives with no direct parent to bump (2026-09-25). Each is
  # the advisory's own first_patched_version, bounded to ONE major: an
  # open-ended ">=" lets the resolver cross a major, which is an upgrade, not a
  # patch. esbuild (<=0.24.2, patched 0.25.0) is deliberately absent: on 0.x a
  # minor bump is a breaking one, and it is dev-only build tooling.
  hono@4: ^4.13.5
  baseline-browser-mapping@2: ^2.11.0
  qs@6: ^6.16.0
  "@humanfs/node": ^0.16.8
  postcss-selector-parser@7: ^7.1.3

# pnpm refuses packages published within its minimum-release-age window — a
# supply-chain guard against a compromised release being installed before
# anyone notices. Our own packages need an explicit exemption, because we are
# the ones who just published them.
#
# Add lines only for packages WE publish — never to hurry along a third-party
# one, which is the entire threat this window exists to cover.
#
# Listed by NAME, not by version. A version-pinned exemption has to be edited
# by hand for every release, and a release nobody edits this file for is simply
# refused at install time — which would make ai-kit's minors arrive manually
# again, one file edit at a time, immediately after 1.0.0 was published to stop
# exactly that. `pnpm add` grew the old pin into `0.6.2 || 1.2.0` on its own,
# which is the second version of a list that would never stop growing.
minimumReleaseAgeExclude:
  - "@bitbaum/ai-kit"
  - "@bitbaum/mail-kit"
  - "bip-kit"
  - "limitkit"
