# Accounts databases beside a supabase schema.
#
# Format: app|database
#
# An app whose apps.conf db column is `supabase:<schema>` keeps its data in that
# schema inside the supabase-db container, reached over PostgREST. That
# container publishes no port, so nothing on the box can open a Postgres
# connection to it, and @bitbaum/accountkit needs one (Drizzle) for its tables.
# A row here gives such an app a SECOND, host database for its accounts:
#
#   - provision-db.yml creates it (provisionable-db.sh accepts the app because
#     of this row) and writes DATABASE_URL and BETTER_AUTH_SECRET to its env;
#   - every deploy applies the app's drizzle/ migrations to it, and its
#     supabase/migrations to the schema, each to its own place (deploy.sh).
#
# A separate register rather than a thirteenth apps.conf column: every reader
# of apps.conf keeps parsing every row exactly as before. The database name is
# the one provision-db-on-box.sh derives from the slug ('-' becomes '_').
# check-accounts-db.sh fails the build when this file and apps.conf disagree.
printcraft|printcraft
botsmann|botsmann
