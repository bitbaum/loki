# Keys every app on the box may use, held ONCE in /opt/fleet/env.
#
# One per line. These are the fleet's shared accounts — the AI vendors' free
# tiers, the web-search backends and the shared mail account — not anything
# that belongs to one app. An app's own .env still wins for any of them (it is
# read after /opt/fleet/env), so an app with its own key keeps it.
#
# Read by: fleet-env.sh (seeds and shows the file), launch.sh.tmpl (runtime),
# selfhost-deploy.yml (build) and api-key-check.sh (is each key alive).
GROQ_API_KEY
GEMINI_API_KEY
OPENROUTER_API_KEY
TOGETHER_API_KEY
CEREBRAS_API_KEY
MISTRAL_API_KEY
BRAVE_API_KEY
TAVILY_API_KEY
RESEND_API_KEY
