# Drop-in for user@<openclaw uid>.service. Installed by every deploy
# (scripts/deploy-hetzner.sh) as
# /etc/systemd/system/user@<uid>.service.d/10-oom-continue.conf — edit it here.
#
# The OpenClaw gateway (WhatsApp, the Telegram chat) runs under the openclaw
# user's systemd manager, and that manager is the only thing that restarts it.
# systemd's default OOMPolicy=stop stops the WHOLE unit when the kernel
# OOM-kills any process in its cgroup. 2026-11-05 07:10 UTC: the box ran out of
# RAM, the kernel killed openclaw-gateway (and then the user's dbus), and
# user@1001.service stopped as "failed" with every user unit inside it. The
# gateway was then left down for more than a day with nothing to bring it back.
# With continue, the victim dies and the manager restarts it (Restart=).
# Same lesson as loki-box-runner (2026-09-25, scripts/hetzner/install-box-runner.sh).
[Service]
OOMPolicy=continue
