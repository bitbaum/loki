# Drop-in for loki-box-runner.service: /etc/systemd/system/loki-box-runner.service.d/memory.conf
# Installed by scripts/hetzner/install-box-runner.sh and re-synced by every
# deploy (scripts/deploy-hetzner.sh), so an edit here reaches the box without a
# laptop holding an ssh key. A daemon-reload applies it to the running unit —
# no restart, so no agent session dies for it.
#
# Sealed builds run each agent in a gVisor sandbox with no per-container memory
# limit: under runsc the processes stay in THIS unit's cgroup, and this bound is
# the only one they have (src/lib/agent-execution/sandbox.ts). Without it,
# 2026-11-06 09:38-09:43: sixteen idle agent tabs held 6.7GB (peak 8.2GB) on a
# 15.6GB box, swap was full, and the kernel's GLOBAL OOM killer took evig's
# next-server, LanguageTool and user@1000.service instead. With the bound, the
# kernel reclaims and, past MemoryMax, kills inside this unit — and
# OOMPolicy=continue keeps the other agents running.
[Service]
MemoryHigh=7G
MemoryMax=8G
