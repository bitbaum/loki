name: CodeQL

# Static analysis (injection, unsafe flows, XSS) on every PR, on main and
# weekly, so new queries meet unchanged code. Results land in the Security tab.
# GitHub offers code scanning free on PUBLIC repositories only; on a private
# one the job is skipped rather than failing red forever.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:javascript-typescript"
