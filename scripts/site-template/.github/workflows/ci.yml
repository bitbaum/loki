name: CI

# "Verified" is defined ONCE, in package.json `verify` (format, lint,
# typecheck, unit tests, build), and run here verbatim — green locally means
# green here. The integration job adds what verify cannot do hermetically:
# the real Postgres schema and the real auth flow, end to end.
#
# Without this file Loki's deploy gate treats "no CI" like "CI green" and
# every push would deploy unverified.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# On main the group is keyed per COMMIT: a newer merge must never cancel an
# older commit's run, because deploys key off that run (fleet templates/ci).
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm BEFORE setup-node: `cache: pnpm` needs the binary. No `version:`
      # input — package.json `packageManager` is the one source.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Next keeps its compiler output in .next/cache and verify BUILDS; keyed
      # on the lockfile so a dependency change invalidates it.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Verify
        run: pnpm run verify

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Accounts against a real Postgres
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app_test
        run: pnpm run test:integration

  # A sweep merge uses GITHUB_TOKEN, and a push made with that token triggers
  # no workflows; the CI the sweep re-arms is a dispatch whose workflow_run
  # GitHub also suppresses. So after an auto-merge nothing would start Deploy
  # until the sweep's reconciler tick. A dispatch is not a push, so this job
  # starts Deploy the moment CI proves main green — only for workflow_dispatch,
  # since a real push chains through workflow_run by itself.
  ship:
    needs: [verify, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # contents: read is not optional: a job-level block turns everything it
    # does not list OFF, and a private repo then cannot check itself out.
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch Deploy now that main is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .github/workflows/deploy.yml ]; then
            gh workflow run deploy.yml --ref main
          else
            echo "no deploy.yml — this repository does not deploy yet"
          fi
