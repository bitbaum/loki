name: Secret scan

# Every commit is scanned for credentials before it can merge, and the whole
# history on main. The gitleaks CLI, not gitleaks-action: the action needs a
# paid licence under an organisation and REFUSES to scan without one, while
# its job stays green-looking in the list (orangecat found this the hard way).
# The download is checked against a pinned SHA-256, so a swapped release
# cannot run here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan every commit
        run: |
          set -euo pipefail
          n=$(git rev-list --count HEAD)
          [ "$n" -gt 0 ] || { echo "::error::nothing to scan — refusing to report a pass"; exit 1; }
          echo "gitleaks: scanning $n commit(s)"
          ./gitleaks git . --redact --no-banner --exit-code 1
