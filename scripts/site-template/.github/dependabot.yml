# Security fixes arrive as pull requests; CI and the auto-merge sweep ship the
# green ones. Version updates are grouped weekly so a dozen bumps are one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
