services:
  db:
    # pgvector, not plain postgres: src/db/schema/knowledge-embeddings.ts
    # declares a `vector(384)` column, so `drizzle-kit push` against a stock
    # image dies on `type "vector" does not exist` and NO table gets created.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: loki
      POSTGRES_USER: loki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs once on first init, before `migrate` — creates the vector extension.
      - ./scripts/db/init-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loki"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://loki:${POSTGRES_PASSWORD:-changeme}@db:5432/loki
    command: sh -c "npm ci --prefer-offline && npx drizzle-kit push"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://loki:${POSTGRES_PASSWORD:-changeme}@db:5432/loki
      AUTH_SECRET: ${AUTH_SECRET}
      # Without this Auth.js 500s on every /api/auth/session — see src/auth.ts.
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      LOCAL_AUTH_PASSWORD: ${LOCAL_AUTH_PASSWORD:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
